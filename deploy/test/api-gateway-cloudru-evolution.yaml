# cloud.ru Evolution API Gateway — TEST
# Backend: Yandex Cloud Function (HTTP public invoke)
#
# CRITICAL: Yandex CF does NOT accept paths after function id:
#   https://functions.yandexcloud.net/<id>/health  → 400 invalid functionID
# Path must be passed as query ?__path=... or header X-Original-Path.
# Upstream host = functions.yandexcloud.net, path = /${WEBAPP_FN_ID}?__path=<route>
#
# Подстановка: deploy-apigw-cloudru.sh
#   ${WEBAPP_FN_ID}  — id webapp Cloud Function (Yandex)
#
# Создание: Разработка → API Gateway → Создать → загрузить YAML
openapi: 3.0.0
info:
  title: checklist-webapp-test
  version: 0.1.1
  description: >
    Proxy SPA + /api/query на Yandex Cloud Function.
    Path передаётся через ?__path= (Yandex CF не поддерживает path в URL).

paths:
  /health:
    get:
      operationId: health
      summary: Health check
      x-cloud-upstream:
        $ref: "#/components/x-cloud-upstreams/WebappYcFn"
      x-cloud-proxy-rewrite:
        uris:
          - forwarded_from: /health
            forwarded_to: /${WEBAPP_FN_ID}?__path=/health
      responses:
        "200":
          description: OK

  /api/health:
    get:
      operationId: apiHealth
      summary: API health
      x-cloud-upstream:
        $ref: "#/components/x-cloud-upstreams/WebappYcFn"
      x-cloud-proxy-rewrite:
        uris:
          - forwarded_from: /api/health
            forwarded_to: /${WEBAPP_FN_ID}?__path=/api/health
      responses:
        "200":
          description: OK

  /api/query:
    post:
      operationId: apiQuery
      summary: YDB query proxy
      x-cloud-upstream:
        $ref: "#/components/x-cloud-upstreams/WebappYcFn"
      x-cloud-proxy-rewrite:
        uris:
          - forwarded_from: /api/query
            forwarded_to: /${WEBAPP_FN_ID}?__path=/api/query
      responses:
        "200":
          description: YDB query result

  /:
    get:
      operationId: spaRoot
      summary: SPA index
      x-cloud-upstream:
        $ref: "#/components/x-cloud-upstreams/WebappYcFn"
      x-cloud-proxy-rewrite:
        uris:
          - forwarded_from: /
            forwarded_to: /${WEBAPP_FN_ID}?__path=/
      responses:
        "200":
          description: SPA index
    head:
      operationId: spaRootHead
      x-cloud-upstream:
        $ref: "#/components/x-cloud-upstreams/WebappYcFn"
      x-cloud-proxy-rewrite:
        uris:
          - forwarded_from: /
            forwarded_to: /${WEBAPP_FN_ID}?__path=/
      responses:
        "200":
          description: SPA

  # Catch-all SPA assets / client routes.
  # If OpenAPI import does not create wildcard, add manually in console:
  #   URI proxy /*  →  /${WEBAPP_FN_ID}?__path=$uri
  /{path}:
    get:
      operationId: spaPath
      summary: SPA asset or client route
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      x-cloud-upstream:
        $ref: "#/components/x-cloud-upstreams/WebappYcFn"
      x-cloud-proxy-rewrite:
        uris:
          - forwarded_from: /{path}
            forwarded_to: /${WEBAPP_FN_ID}?__path=/{path}
      responses:
        "200":
          description: SPA asset or index
    head:
      operationId: spaPathHead
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      x-cloud-upstream:
        $ref: "#/components/x-cloud-upstreams/WebappYcFn"
      x-cloud-proxy-rewrite:
        uris:
          - forwarded_from: /{path}
            forwarded_to: /${WEBAPP_FN_ID}?__path=/{path}
      responses:
        "200":
          description: SPA
    options:
      operationId: spaPathOptions
      summary: CORS preflight
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      x-cloud-upstream:
        $ref: "#/components/x-cloud-upstreams/WebappYcFn"
      x-cloud-proxy-rewrite:
        uris:
          - forwarded_from: /{path}
            forwarded_to: /${WEBAPP_FN_ID}?__path=/{path}
      responses:
        "204":
          description: CORS

components:
  x-cloud-upstreams:
    WebappYcFn:
      name: WebappYcFn
      description: Yandex Cloud Function webapp (public HTTP invoke, path via ?__path=)
      type: url
      scheme: https
      nodes:
        - host: functions.yandexcloud.net
          weight: 1
      timeout:
        connect: 5
        send: 10
        read: 35
